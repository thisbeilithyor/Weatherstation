<body>
    <div class="header" onclick="window.location.href='/'">

        <div class="left-top-prev" id="left-top-prev">

        <div class="middle-right-top-prev" >

<script>
    document.addEventListener('DOMContentLoaded', function() {
        updateData();
        setInterval(updateData, 60000);
    });

    function updateData(){
        console.log("update");
        fetch('http://IP_ADDRESS:443/getStoria')
        .then(response => response.json())
        .then(res => {
            console.log(res.data);
            for(let i=0; i<res.data.length; i++){
                const myimg = document.getElementById(i+'');
                myimg.src = res.data[i];

                let id = "0"+i;
                const p = document.getElementById(id)
                const dateObj = new Date(res.timestamp[i]);
                const currentTime = new Date();

                const differenceInMillis = currentTime.getTime() - dateObj.getTime();
                console.log(currentTime.getMilliseconds())


                const differenceInMinutes = Math.floor(differenceInMillis / (1000 * 60));
                const mins = differenceInMinutes % 60;
                let hours = differenceInMillis / (3600*1000); //.getHours() - dateObj.getHours();
                console.log(hours);
                if(hours < 1){
                    hours = 0;
                }else{
                    hours = Math.floor(hours)
                }
                const time = dateObj.toISOString().split('T')[1].split('.')[0];


                p.innerHTML = "vor "+hours + "h " + mins+"min<br>"
                p.innerHTML += "um "+time
            }
        })
    }
</script>
