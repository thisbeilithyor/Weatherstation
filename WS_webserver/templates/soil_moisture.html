<!DOCTYPE html>
<html lang="de" xmlns:mso="urn:schemas-microsoft-com:office:office" xmlns:msdt="uuid:C2F41010-65B3-11d1-A29F-00AA00C14882">
<head>
    <meta charset="UTF-8">
    <title>Bodenfeuchte</title>
    <link rel="stylesheet" href="./static/css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>
</head> 
<body>

<div class="header" onclick="window.location.href='/'">
        <img class="logo" src="./static/img/logo.png"/>
        <div class="header-text">WETTERSTATION</div>
        <div class="weather-header">
        </div>
    </div>
    <p style="color:white; font-family: audi-extended; font-size: 1.5vw; padding: 1vw;">Bodenfeuchte</p>
    <div class="prev-upper-small"></div>
    <canvas id="ground_moisture_canvas" class="ground_moisture_canvas" height=60></canvas> 
</body>
<script>
    
async function getSoilMoistureHistory() {
    try{
        const response = await fetch('http://IP_ADDRESS:443/getSoilMoistureHistory');
        const res = await response.json();
        const soil_moistures = await res.data.soil_moistures;
        const timestamps = await res.data.timestamps;
        return [soil_moistures, timestamps];
    }
    catch(error){
        console.log(error);
    }
}

async function createChart() {
    try {
        const [soil_moistures, time] = await getSoilMoistureHistory();

        //console.log(soil_moistures);
        pv = [4, 5, 1, 3];
        hours = [1, 2, 3, 4];
        new Chart("ground_moisture_canvas", {
        type: "line",
        data: {
            labels: time,
            datasets: [{
            data: soil_moistures,
            borderColor: '#f50537',
            fill: true,
            tension: 0.4,
            borderWidth: 1
            }]
        },
        options: {
            legend: {
                display: false
            },
            scales:{
                xAxes: [{
                    display: true, //this will remove all the x-axis grid lines,
                    ticks:{
                        fontColor: '#ffffff'
                    }
                }],
                yAxes: [{
                    display: true,
                    ticks: {
                        suggestedMin: 0,
                        suggestedMax: 100,
                        fontColor: '#ffffff'
                    }
                }]
            },
            responsive: true
        }
        });
    } catch (error) {
        console.error('Error fetching temperature history:', error);
    }
}

createChart();
setInterval(createChart, 60000);
</script>
</html>
