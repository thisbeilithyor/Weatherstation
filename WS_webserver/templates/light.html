<!DOCTYPE html>
<html lang="de" xmlns:mso="urn:schemas-microsoft-com:office:office" xmlns:msdt="uuid:C2F41010-65B3-11d1-A29F-00AA00C14882">
<head>
    <meta charset="UTF-8">
    <title>Temperatur</title>
    <link rel="stylesheet" href="./static/css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>
</head> 
<body>
<div class="header" onclick="window.location.href='/'">
        <img class="logo" src="./static/img/logo.png"/>
        <div class="header-text">WETTERSTATION</div>
        <div class="weather-header">
        </div>
    </div>
    <p style="color:white; font-family: audi-extended; font-size: 1.5vw; padding: 1vw;">Licht</p>
    <div class="prev-upper-big"></div>
    <canvas id="temp_canvas" class="temp_canvas" height=40></canvas> 
</body>
<script>
    
async function getLightHistory() {
    try{
        const response = await fetch('http://IP_ADDRESS:443/getLightHistory');
        const res = await response.json();
        const lights = await res.data.lights;
        const timestamps = await res.data.timestamps;
        console.log(lights, timestamps);
        return [lights, timestamps];
    }
    catch(error){
        console.log(error);
    }
}

async function createChart() {
    try {
        const [light_values, time] = await getLightHistory();

        new Chart("temp_canvas", {
            type: "line",
            data: {
                labels: time,
                datasets: [{
                    data: light_values,
                    borderColor: '#f50537',
                    fill: true,
                    tension: 0.4,
                    borderWidth: 1
                }]
            },
            options: {
                legend: {
                    display: false
                },
                scales:{
                    xAxes: [{
                        display: true,
                        ticks: {
                            fontColor: '#ffffff'
                        }
                    }],
                    yAxes: [{
                        display: true,
                        ticks: {
                            fontColor: '#ffffff'
                        }
                    }]
                },
                responsive: true
            }
        });
    } catch (error) {
        console.error('Error fetching temperature history:', error);
    }
}

createChart();
setInterval(createChart, 60000);
</script>
</html>
